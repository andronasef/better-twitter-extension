<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home / X</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    [data-testid="cellInnerDiv"] { min-height: 120px; border-bottom: 1px solid #333; }
    [role="separator"] { height: 1px; background: #222; }
  </style>
</head>
<body>
  <div data-testid="primaryColumn">
    <nav style="padding: 10px;">
      <button id="nav-profile" onclick="navigateToProfile()">Go to Profile</button>
    </nav>
    <section>
      <h1>Home Timeline</h1>
      <div aria-label="Timeline: Your Home Timeline">
        <div style="position: relative; min-height: 1000px;">
          <!-- Tweet Cell 1 (Organic) -->
          <div data-testid="cellInnerDiv" style="transform: translateY(0px);">
            <div>
              <article data-testid="tweet">
                <a href="https://x.com/user1/status/1000000000000000001">Organic Tweet 1</a>
                <p>Hello world from regular tweet</p>
              </article>
            </div>
          </div>
          <!-- Tweet Cell 2 (Promoted) -->
          <div data-testid="cellInnerDiv" style="transform: translateY(120px);">
            <div>
              <article data-testid="tweet">
                <div data-testid="placementTracking">
                  <span>Promoted</span>
                </div>
                <a href="https://x.com/sponsor/status/1000000000000000002">Promoted Tweet 2</a>
                <p>Buy this amazing product today!</p>
              </article>
            </div>
          </div>
          <div role="separator"></div>
          <!-- Tweet Cell 3 (Organic) -->
          <div data-testid="cellInnerDiv" style="transform: translateY(240px);">
            <div>
              <article data-testid="tweet">
                <a href="https://x.com/user2/status/1000000000000000003">Organic Tweet 3</a>
                <p>Another regular tweet</p>
              </article>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script>
    function navigateToProfile() {
      history.pushState({}, '', 'https://x.com/someuser');
      document.title = 'User Profile / X';
      const container = document.querySelector('[aria-label="Timeline: Your Home Timeline"]');
      if (container) {
        const newTimeline = document.createElement('div');
        newTimeline.setAttribute('style', 'position: relative; min-height: 1000px;');
        newTimeline.innerHTML = `
          <!-- Profile Organic Tweet -->
          <div data-testid="cellInnerDiv" style="transform: translateY(0px);">
            <div>
              <article data-testid="tweet">
                <a href="https://x.com/someuser/status/2000000000000000001">Profile Tweet 1</a>
                <p>Welcome to my profile!</p>
              </article>
            </div>
          </div>
          <!-- Profile Promoted Tweet -->
          <div data-testid="cellInnerDiv" style="transform: translateY(120px);">
            <div>
              <article data-testid="tweet">
                <div data-testid="placementTracking">
                  <span>Promoted</span>
                </div>
                <a href="https://x.com/sponsor2/status/2000000000000000002">Profile Promoted Tweet 2</a>
                <p>Buy profile sponsor ad!</p>
              </article>
            </div>
          </div>
        `;
        container.replaceChildren(newTimeline);
      }
    }

    // Handle query parameter for synthetic broken selector
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('break-promoted') === '1' || urlParams.get('break-selector') === '1') {
      const trackingEl = document.querySelector('[data-testid="placementTracking"]');
      if (trackingEl) {
        trackingEl.setAttribute('data-testid', 'brokenPlacementTracking');
      }
    }

    window.addTweetCell = function(isPromoted) {
      const timeline = document.querySelector('[aria-label="Timeline: Your Home Timeline"] > div');
      if (!timeline) return;
      const id = Date.now() + Math.floor(Math.random() * 1000);
      const cell = document.createElement('div');
      cell.setAttribute('data-testid', 'cellInnerDiv');
      const broken =
        window.__promotedBroken !== undefined
          ? window.__promotedBroken
          : urlParams.get('break-promoted') === '1' ||
            urlParams.get('break-selector') === '1';
      if (isPromoted) {
        cell.innerHTML = '<div><article data-testid="tweet"><div data-testid="' + (broken ? 'brokenPlacementTracking' : 'placementTracking') + '"><span>Promoted</span></div><a href="https://x.com/sponsor/status/' + id + '">Promoted ' + id + '</a><p>Ad</p></article></div>';
      } else {
        cell.innerHTML = '<div><article data-testid="tweet"><a href="https://x.com/user/status/' + id + '">Tweet ' + id + '</a><p>Content</p></article></div>';
      }
      timeline.appendChild(cell);
    };

    window.breakMarker = function() {
      window.__promotedBroken = true;
      const el = document.querySelector('[data-testid="placementTracking"]');
      if (el) el.setAttribute('data-testid', 'brokenPlacementTracking');
    };

    window.restoreMarker = function() {
      window.__promotedBroken = false;
      const el = document.querySelector('[data-testid="brokenPlacementTracking"]');
      if (el) el.setAttribute('data-testid', 'placementTracking');
      window.addTweetCell(true);
    };
  </script>
</body>
</html>
