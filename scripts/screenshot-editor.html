<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better Twitter - CWS Screenshot & Asset Studio</title>
    <style>
      :root {
        --bg-main: #0b0e14;
        --bg-panel: #161b22;
        --bg-input: #0d1117;
        --border: #30363d;
        --accent: #1d9bf0;
        --accent-hover: #1a8cd8;
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-main);
        color: var(--text-primary);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar Controls */
      .sidebar {
        width: 420px;
        min-width: 420px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .sidebar-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-badge {
        background: var(--accent);
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 18px;
        color: #ffffff;
      }

      .sidebar-header h1 {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }

      .sidebar-header p {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .controls-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .control-group label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
      }

      .button-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      button.preset-btn {
        background: var(--bg-input);
        border: 1px solid var(--border);
        color: var(--text-primary);
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
        text-align: center;
      }

      button.preset-btn:hover {
        border-color: var(--accent);
      }

      button.preset-btn.active {
        background: rgba(29, 155, 240, 0.15);
        border-color: var(--accent);
        color: var(--accent);
      }

      input[type="text"],
      textarea,
      select {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border);
        color: var(--text-primary);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s ease;
      }

      input[type="text"]:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent);
      }

      textarea {
        resize: vertical;
        min-height: 56px;
      }

      .color-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .color-input-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
      }

      input[type="color"] {
        -webkit-appearance: none;
        border: none;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        cursor: pointer;
        background: transparent;
      }

      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      input[type="color"]::-webkit-color-swatch {
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .slider-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .slider-header {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-secondary);
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .drop-zone {
        border: 2px dashed var(--border);
        border-radius: 8px;
        padding: 16px;
        text-align: center;
        background: var(--bg-input);
        cursor: pointer;
        transition: border-color 0.15s ease;
      }

      .drop-zone:hover {
        border-color: var(--accent);
      }

      .drop-zone p {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
      }

      .sidebar-footer {
        padding: 16px 20px;
        border-top: 1px solid var(--border);
        background: var(--bg-panel);
      }

      .export-btn {
        width: 100%;
        background: var(--accent);
        color: #ffffff;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .export-btn:hover {
        background: var(--accent-hover);
      }

      /* Main Canvas Viewport */
      .viewport {
        flex: 1;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        position: relative;
        overflow: hidden;
      }

      .canvas-container {
        max-width: 100%;
        max-height: 100%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        max-height: 80vh;
        object-fit: contain;
      }

      .dim-badge {
        position: absolute;
        bottom: 16px;
        right: 20px;
        background: rgba(22, 27, 34, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <!-- Left Sidebar Settings -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-badge">BT</div>
        <div>
          <h1>CWS Asset Studio</h1>
          <p>Better Twitter Store Screenshot Generator</p>
        </div>
      </div>

      <div class="controls-scroll">
        <!-- Presets -->
        <div class="control-group">
          <label>Canvas Dimension Preset</label>
          <div class="button-row">
            <button
              class="preset-btn active"
              data-w="1280"
              data-h="800"
              id="preset-screenshot"
            >
              1280x800<br /><small>Screenshot</small>
            </button>
            <button
              class="preset-btn"
              data-w="440"
              data-h="280"
              id="preset-small"
            >
              440x280<br /><small>Small Tile</small>
            </button>
            <button
              class="preset-btn"
              data-w="1400"
              data-h="560"
              id="preset-marquee"
            >
              1400x560<br /><small>Marquee</small>
            </button>
          </div>
        </div>

        <!-- Quick Copy Templates -->
        <div class="control-group">
          <label>Copy Template</label>
          <select id="template-select">
            <option value="clean">
              Clean Timeline (Focus on What Matters)
            </option>
            <option value="themes">Custom Themes & Old Twitter Layout</option>
            <option value="bookmarks">
              Local Bookmarks & Timeline Resurfacing
            </option>
            <option value="reactions">Quick Twemoji Reactions</option>
            <option value="custom">Custom Text</option>
          </select>
        </div>

        <!-- Text Overlays -->
        <div class="control-group">
          <label for="headline-input">Headline</label>
          <input
            type="text"
            id="headline-input"
            value="Focus on What Matters"
          />
        </div>

        <div class="control-group">
          <label for="subtext-input">Subtext</label>
          <textarea id="subtext-input">
Strip promoted ads, vanity metrics, and algorithmic sidebar clutter.</textarea>
        </div>

        <!-- Image Upload / Selection -->
        <div class="control-group">
          <label>Screenshot Image</label>
          <div
            class="drop-zone"
            id="drop-zone"
            onclick="document.getElementById('file-input').click()"
          >
            <strong>Choose or drop an image</strong>
            <p id="file-name-label">
              Using sample or drop from screenshots/ folder
            </p>
            <input
              type="file"
              id="file-input"
              accept="image/*"
              style="display: none"
            />
          </div>
        </div>

        <!-- Styling & Layout -->
        <div class="control-group">
          <label>Background Theme</label>
          <select id="bg-theme-select">
            <option value="x-dark">X Lights Out (Black & Deep Blue)</option>
            <option value="dracula">Dracula Dark (Purple & Slate)</option>
            <option value="nord">Nord Polar (Arctic Blue & Charcoal)</option>
            <option value="matrix">Hacker Matrix (OLED Black & Emerald)</option>
          </select>
        </div>

        <!-- Sliders -->
        <div class="control-group">
          <div class="slider-row">
            <div class="slider-header">
              <span>Image Scale</span>
              <span id="scale-val">82%</span>
            </div>
            <input
              type="range"
              id="scale-slider"
              min="40"
              max="130"
              value="82"
            />
          </div>

          <div class="slider-row" style="margin-top: 10px">
            <div class="slider-header">
              <span>Vertical Offset (Y)</span>
              <span id="offset-val">30px</span>
            </div>
            <input
              type="range"
              id="offset-slider"
              min="-100"
              max="200"
              value="30"
            />
          </div>

          <div class="slider-row" style="margin-top: 10px">
            <div class="slider-header">
              <span>Corner Radius</span>
              <span id="radius-val">16px</span>
            </div>
            <input
              type="range"
              id="radius-slider"
              min="0"
              max="32"
              value="16"
            />
          </div>

          <div class="slider-row" style="margin-top: 10px">
            <div class="slider-header">
              <span>Shadow Blur</span>
              <span id="shadow-val">40px</span>
            </div>
            <input
              type="range"
              id="shadow-slider"
              min="0"
              max="80"
              value="40"
            />
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="export-btn" id="export-btn">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export PNG for Chrome Web Store
        </button>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="viewport">
      <div class="canvas-container">
        <canvas id="preview-canvas" width="1280" height="800"></canvas>
      </div>
      <div class="dim-badge" id="dim-indicator">1280 × 800 (16:10)</div>
    </main>

    <script>
      const canvas = document.getElementById("preview-canvas");
      const ctx = canvas.getContext("2d");

      let canvasWidth = 1280;
      let canvasHeight = 800;

      let loadedImage = null;
      let headline = "Focus on What Matters";
      let subtext =
        "Strip promoted ads, vanity metrics, and algorithmic sidebar clutter.";
      let scalePercent = 82;
      let offsetY = 30;
      let cornerRadius = 16;
      let shadowBlur = 40;
      let bgTheme = "x-dark";

      const templates = {
        clean: {
          headline: "Focus on What Matters",
          subtext:
            "Strip promoted ads, vanity metrics, and algorithmic sidebar clutter.",
        },
        themes: {
          headline: "Read In Your Own Style",
          subtext:
            "Dracula, Nord, Matrix, and classic Old Twitter desktop layout.",
        },
        bookmarks: {
          headline: "Never Lose What You Save",
          subtext:
            "Searchable in-page bookmark manager and timeline feed resurfacing.",
        },
        reactions: {
          headline: "Express Yourself Faster",
          subtext:
            "Native Twemoji palette shortcut with pre-filled reply composer.",
        },
      };

      // Create a default placeholder mock UI if no user screenshot is uploaded yet
      function createPlaceholderImage() {
        const pCanvas = document.createElement("canvas");
        pCanvas.width = 1100;
        pCanvas.height = 700;
        const pCtx = pCanvas.getContext("2d");

        // App frame
        pCtx.fillStyle = "#000000";
        pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

        // Sidebar mock
        pCtx.fillStyle = "#16181c";
        pCtx.fillRect(0, 0, 260, pCanvas.height);

        // Feed mock
        pCtx.fillStyle = "#202327";
        pCtx.fillRect(300, 30, 480, 180);
        pCtx.fillRect(300, 240, 480, 220);
        pCtx.fillRect(300, 490, 480, 160);

        // Header mock
        pCtx.fillStyle = "#1d9bf0";
        pCtx.font = "bold 20px -apple-system, BlinkMacSystemFont, sans-serif";
        pCtx.fillText("Better Twitter Mockup", 300, 20);

        const img = new Image();
        img.src = pCanvas.toDataURL();
        img.onload = () => {
          if (!loadedImage) {
            loadedImage = img;
            render();
          }
        };
      }

      function roundRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(
          x + width,
          y + height,
          x + width - radius,
          y + height,
        );
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      function drawBackground() {
        let grad = ctx.createLinearGradient(0, 0, canvasWidth, canvasHeight);
        if (bgTheme === "x-dark") {
          grad.addColorStop(0, "#080c10");
          grad.addColorStop(0.5, "#0b141e");
          grad.addColorStop(1, "#070b0e");
        } else if (bgTheme === "dracula") {
          grad.addColorStop(0, "#191a21");
          grad.addColorStop(0.5, "#282a36");
          grad.addColorStop(1, "#181820");
        } else if (bgTheme === "nord") {
          grad.addColorStop(0, "#242933");
          grad.addColorStop(0.5, "#2e3440");
          grad.addColorStop(1, "#1e222a");
        } else if (bgTheme === "matrix") {
          grad.addColorStop(0, "#000000");
          grad.addColorStop(0.5, "#04140a");
          grad.addColorStop(1, "#000000");
        }

        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        // Subtle accent ambient glow
        const glow = ctx.createRadialGradient(
          canvasWidth / 2,
          canvasHeight * 0.75,
          50,
          canvasWidth / 2,
          canvasHeight * 0.75,
          canvasWidth * 0.6,
        );
        if (bgTheme === "matrix") {
          glow.addColorStop(0, "rgba(0, 255, 102, 0.08)");
        } else if (bgTheme === "dracula") {
          glow.addColorStop(0, "rgba(189, 147, 249, 0.08)");
        } else {
          glow.addColorStop(0, "rgba(29, 155, 240, 0.12)");
        }
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }

      function drawText() {
        ctx.textAlign = "center";

        let headlineSize = 44;
        let subtextSize = 20;
        let startY = 80;

        if (canvasHeight <= 300) {
          // Small Tile (440x280)
          headlineSize = 22;
          subtextSize = 12;
          startY = 42;
        } else if (canvasHeight <= 600) {
          // Marquee Tile (1400x560)
          headlineSize = 46;
          subtextSize = 21;
          startY = 85;
        }

        // Draw Badge or Product tag
        ctx.font = `700 ${Math.max(10, Math.round(headlineSize * 0.28))}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.fillStyle = "#1d9bf0";
        ctx.fillText("BETTER TWITTER", canvasWidth / 2, startY);

        // Draw Headline
        ctx.font = `800 ${headlineSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 4;
        ctx.fillText(
          headline,
          canvasWidth / 2,
          startY + Math.round(headlineSize * 1.15),
        );

        // Draw Subtext
        ctx.font = `400 ${subtextSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.fillStyle = "#94a3b8";
        ctx.shadowBlur = 4;
        ctx.fillText(
          subtext,
          canvasWidth / 2,
          startY +
            Math.round(headlineSize * 1.15) +
            Math.round(subtextSize * 1.7),
        );

        // Reset shadow
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
      }

      function drawMockup() {
        if (!loadedImage) return;

        const imgRatio = loadedImage.width / loadedImage.height;
        const availableHeight = canvasHeight * (scalePercent / 100);
        let targetWidth = availableHeight * imgRatio;
        let targetHeight = availableHeight;

        // Ensure max bounds
        if (targetWidth > canvasWidth * 0.94) {
          targetWidth = canvasWidth * 0.94;
          targetHeight = targetWidth / imgRatio;
        }

        const posX = (canvasWidth - targetWidth) / 2;
        const posY =
          canvasHeight -
          targetHeight +
          offsetY * (canvasHeight / 800) +
          (canvasHeight <= 300 ? 10 : 0);

        ctx.save();

        // Shadow
        ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
        ctx.shadowBlur = shadowBlur * (canvasHeight / 800);
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 16 * (canvasHeight / 800);

        // Outer Frame with clipping
        const rad = cornerRadius * (canvasHeight / 800);
        roundRect(ctx, posX, posY, targetWidth, targetHeight, rad);
        ctx.fillStyle = "#000000";
        ctx.fill();

        // Clip and draw image
        ctx.clip();
        ctx.drawImage(loadedImage, posX, posY, targetWidth, targetHeight);

        // Subtle border stroke
        ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
        ctx.lineWidth = 2;
        roundRect(ctx, posX, posY, targetWidth, targetHeight, rad);
        ctx.stroke();

        ctx.restore();
      }

      function render() {
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        drawBackground();
        drawText();
        drawMockup();

        document.getElementById("dim-indicator").textContent =
          `${canvasWidth} × ${canvasHeight} (${(canvasWidth / canvasHeight).toFixed(2)}:1)`;
      }

      // Event Listeners
      document
        .getElementById("headline-input")
        .addEventListener("input", (e) => {
          headline = e.target.value;
          render();
        });

      document
        .getElementById("subtext-input")
        .addEventListener("input", (e) => {
          subtext = e.target.value;
          render();
        });

      document
        .getElementById("template-select")
        .addEventListener("change", (e) => {
          const val = e.target.value;
          if (templates[val]) {
            headline = templates[val].headline;
            subtext = templates[val].subtext;
            document.getElementById("headline-input").value = headline;
            document.getElementById("subtext-input").value = subtext;
            render();
          }
        });

      document
        .getElementById("bg-theme-select")
        .addEventListener("change", (e) => {
          bgTheme = e.target.value;
          render();
        });

      document.getElementById("scale-slider").addEventListener("input", (e) => {
        scalePercent = parseInt(e.target.value, 10);
        document.getElementById("scale-val").textContent = `${scalePercent}%`;
        render();
      });

      document
        .getElementById("offset-slider")
        .addEventListener("input", (e) => {
          offsetY = parseInt(e.target.value, 10);
          document.getElementById("offset-val").textContent = `${offsetY}px`;
          render();
        });

      document
        .getElementById("radius-slider")
        .addEventListener("input", (e) => {
          cornerRadius = parseInt(e.target.value, 10);
          document.getElementById("radius-val").textContent =
            `${cornerRadius}px`;
          render();
        });

      document
        .getElementById("shadow-slider")
        .addEventListener("input", (e) => {
          shadowBlur = parseInt(e.target.value, 10);
          document.getElementById("shadow-val").textContent = `${shadowBlur}px`;
          render();
        });

      // Presets
      document.querySelectorAll(".preset-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".preset-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          canvasWidth = parseInt(btn.dataset.w, 10);
          canvasHeight = parseInt(btn.dataset.h, 10);
          render();
        });
      });

      // Image Loading
      function handleFile(file) {
        if (!file || !file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            loadedImage = img;
            document.getElementById("file-name-label").textContent = file.name;
            render();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      document.getElementById("file-input").addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          handleFile(e.target.files[0]);
        }
      });

      const dropZone = document.getElementById("drop-zone");
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "var(--accent)";
      });
      dropZone.addEventListener("dragleave", () => {
        dropZone.style.borderColor = "var(--border)";
      });
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "var(--border)";
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      });

      // Exporting PNG
      document.getElementById("export-btn").addEventListener("click", () => {
        canvas.toBlob((blob) => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const slug = headline
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "");
          a.download = `better-twitter-${canvasWidth}x${canvasHeight}-${slug || "cws"}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, "image/png");
      });

      // Initial run
      createPlaceholderImage();
